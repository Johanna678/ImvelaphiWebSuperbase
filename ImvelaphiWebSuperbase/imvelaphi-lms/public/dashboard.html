<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — Imvelaphi LMS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">

<header class="app-header" id="headerMount"></header>

<main class="app-main">
  <h2 class="page-title" id="greeting">Welcome back</h2>
  <p class="page-sub">Here's where you left off across your assigned courses.</p>

  <div class="stat-strip" id="statStrip"></div>
  <div class="course-list" id="courseList"><div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading your courses…</p></div></div>
</main>

<script src="js/app.js"></script>
<script>
  const user = STORE.requireRole(['student']);
  if (user) {
    mountChatWidget();
    renderAppHeader('headerMount', 'Student dashboard');
    document.getElementById('greeting').textContent = `Welcome back, ${user.firstName}`;

    (async () => {
      const data = await STORE.getDashboard();
      if (!data.success) return;
      const courses = data.courses;

      const avgPct = Math.round(courses.reduce((a,c)=>a+c.progress.pct,0) / (courses.length||1));
      const completedCourses = courses.filter(c => c.progress.pct === 100).length;
      const quizScores = courses.map(c=>c.progress.quizAvg).filter(v=>v!=null);
      const avgQuiz = quizScores.length ? Math.round(quizScores.reduce((a,b)=>a+b,0)/quizScores.length) : '—';

      document.getElementById('statStrip').innerHTML = `
        <div class="stat-box"><div class="n">${avgPct}%</div><div class="l">Overall progress</div></div>
        <div class="stat-box"><div class="n">${completedCourses}/${courses.length}</div><div class="l">Courses completed</div></div>
        <div class="stat-box"><div class="n">${avgQuiz}${quizScores.length?'%':''}</div><div class="l">Average quiz score</div></div>
      `;

      document.getElementById('courseList').innerHTML = courses.map(c => `
        <div class="course-row" onclick="window.location.href='course.html?id=${c.id}'">
          <div class="icon-badge"><i class="${c.icon}"></i></div>
          <div class="body">
            <h4>${c.title}</h4>
            <div class="progress-row"><span>${c.progress.watched}/${c.progress.total} videos watched</span><span>${c.progress.pct}%</span></div>
            <div class="progress-track"><div class="progress-fill" style="width:${c.progress.pct}%"></div></div>
          </div>
          <div class="chip">${c.progress.pct === 100 ? 'Completed' : c.progress.pct > 0 ? 'In progress' : 'Not started'}</div>
        </div>
      `).join('') || `<div class="empty-state"><i class="fa-solid fa-inbox"></i><p>No courses assigned yet.</p></div>`;
    })();
  }
</script>
</body>
</html>
