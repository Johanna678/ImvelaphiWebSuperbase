<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course — Imvelaphi Tech</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-shell">

<header class="app-header" id="headerMount"></header>

<main class="app-main">
  <a href="dashboard.html" class="btn-ghost btn-sm" style="display:inline-flex; margin-bottom:20px;"><i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i>Back to dashboard</a>

  <h2 class="page-title" id="courseTitle">Loading…</h2>
  <p class="page-sub" id="courseDesc"></p>

  <div class="video-layout" id="layout" style="display:none;">
    <div>
      <div class="player-wrap" id="playerWrap"></div>
      <div class="panel" id="quizPanel" style="margin-top:20px;"></div>
    </div>
    <div class="panel">
      <h3>Videos in this course</h3>
      <div id="videoNav"></div>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  const user = STORE.requireRole(['student']);
  const params = new URLSearchParams(window.location.search);
  const courseId = params.get('id');

  let course = null;
  let currentVideoIndex = 0;
  const localAnswers = {};

  async function load() {
    const data = await STORE.getCourse(courseId);
    if (!data.success) {
      document.querySelector('.app-main').innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>${data.message || 'Course not found.'}</p></div>`;
      return;
    }
    course = data.course;
    document.getElementById('courseTitle').textContent = course.title;
    document.getElementById('courseDesc').textContent = course.description;
    document.getElementById('layout').style.display = 'grid';
    renderAppHeader('headerMount', course.title);
    mountChatWidget();
    selectVideo(0);
  }

  function renderNav() {
    document.getElementById('videoNav').innerHTML = course.videos.map((v, i) => `
      <div class="video-nav-item ${i===currentVideoIndex?'active':''} ${v.progress.watched?'done':''}" onclick="selectVideo(${i})">
        <span class="status-dot"></span>
        <div>
          <div class="vt">${v.title}</div>
          <div class="vs">${v.duration}${v.progress.quizScore!=null ? ' · quiz '+v.progress.quizScore+'/'+v.progress.quizTotal : ''}</div>
        </div>
      </div>`).join('');
  }

  function renderPlayer() {
    const v = course.videos[currentVideoIndex];
    const wrap = document.getElementById('playerWrap');
    if (v.videoUrl) {
      wrap.innerHTML = `<video controls src="${v.videoUrl}" style="width:100%; display:block;"></video>`;
    } else {
      // Reserved space: no file uploaded yet for this video
      wrap.innerHTML = `
        <div class="video-placeholder">
          <i class="fa-solid fa-video"></i>
          <span>VIDEO COMING SOON — reserved for "${v.title}"</span>
        </div>`;
    }
  }

  function renderQuizPanel() {
    const v = course.videos[currentVideoIndex];
    const panel = document.getElementById('quizPanel');

    if (v.progress.quizScore != null) {
      panel.innerHTML = `
        <h3>Quiz result</h3>
        <p style="color:var(--muted); margin-bottom:16px;">You scored <strong style="color:var(--white);">${v.progress.quizScore}/${v.progress.quizTotal}</strong> on this quiz.</p>
      `;
      return;
    }
    if (!v.quiz.length) {
      panel.innerHTML = `<h3>No quiz yet</h3><p style="color:var(--muted);">Your lecturer hasn't added a quiz for this video.</p>`;
      return;
    }

    panel.innerHTML = `
      <h3>Quiz: ${v.title}</h3>
      <p style="color:var(--muted); margin-bottom:18px; font-size:0.88rem;">Answer all questions, then submit to save your score and mark this video complete.</p>
      <div id="quizQuestions"></div>
      <button class="btn btn-primary" id="submitQuizBtn" onclick="submitQuiz()">Submit quiz</button>
    `;
    document.getElementById('quizQuestions').innerHTML = v.quiz.map((q, qi) => `
      <div class="quiz-q">
        <p class="qtext">${qi+1}. ${q.question}</p>
        ${q.options.map((opt, oi) => `
          <div class="quiz-opt" data-qid="${q.id}" data-oi="${oi}" onclick="chooseOption('${q.id}',${oi})">${opt}</div>
        `).join('')}
      </div>
    `).join('');
  }

  function chooseOption(qid, oi) {
    localAnswers[qid] = oi;
    document.querySelectorAll(`.quiz-opt[data-qid="${qid}"]`).forEach(el => {
      el.classList.toggle('selected', Number(el.dataset.oi) === oi);
    });
  }

  function selectVideo(i) {
    currentVideoIndex = i;
    Object.keys(localAnswers).forEach(k => delete localAnswers[k]);
    renderNav();
    renderPlayer();
    renderQuizPanel();
  }

  async function submitQuiz() {
    const v = course.videos[currentVideoIndex];
    if (Object.keys(localAnswers).length < v.quiz.length) { alert('Please answer every question before submitting.'); return; }
    document.getElementById('submitQuizBtn').disabled = true;
    document.getElementById('submitQuizBtn').textContent = 'Submitting…';

    const res = await STORE.submitQuiz(courseId, v.id, localAnswers);
    if (!res.success) { alert(res.message || 'Could not submit quiz.'); return; }

    res.results.forEach(r => {
      document.querySelectorAll(`.quiz-opt[data-qid="${r.questionId}"]`).forEach(el => {
        const oi = Number(el.dataset.oi);
        if (oi === r.correctIndex) el.classList.add('correct');
        else if (oi === r.selected) el.classList.add('incorrect');
      });
    });

    v.progress = { watched:true, quizScore: res.score, quizTotal: res.total };
    setTimeout(() => { renderNav(); renderQuizPanel(); }, 900);
  }

  window.selectVideo = selectVideo;
  window.chooseOption = chooseOption;
  window.submitQuiz = submitQuiz;

  if (user && courseId) load();
  else if (user) document.querySelector('.app-main').innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>No course specified.</p></div>`;
</script>
</body>
</html>
